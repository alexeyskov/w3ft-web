<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1118">
<meta name="robots" content="noindex">
<title>Memory test</title>
<link rel="icon" type="image/png" href="/favicon.png?v=1" sizes="64x64">
<link rel="stylesheet" href="/styles/main.css">
<script type="module" src="/src/memory-test.mjs"></script>
</head>
<body data-phase="ready">
<main class="app memory-test">
  <header class="top">
    <div class="brand"><h1 id="title">Проверка памяти</h1><p class="hint" id="intro"></p></div>
  </header>
  <section class="panel">
    <p id="previous" class="notice" hidden></p>
    <p id="status"></p>
    <div class="row">
      <button class="play" id="full"></button>
      <button class="btn" id="memory"></button>
      <button class="btn" id="copy" hidden></button>
    </div>
    <pre id="details"></pre>
  </section>
</main>
</body>
</html>
