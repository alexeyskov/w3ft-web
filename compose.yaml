services:
  web:
    build: .
    init: true
    environment:
      WC3_ADMIN_PASSWORD_HASH: ${WC3_ADMIN_PASSWORD_HASH:-}
      WC3_HOST_NET_DEV: /run/host-net-dev
      WC3_ISSUES_DIR: /app/var/issues
      WC3_ACTIVITY_DIR: /app/var/activity
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - issue_data:/app/var/issues
      - activity_data:/app/var/activity
      # Launcher files can be updated without restarting active LAN sessions.
      - type: bind
        source: ./web
        target: /app/web
        read_only: true
        bind:
          create_host_path: false
      # Linux VPS network counters, including Caddy's traffic. No host PID
      # namespace, Docker socket or privileged container access is required.
      - type: bind
        source: /proc/1/net/dev
        target: /run/host-net-dev
        read_only: true
        bind:
          create_host_path: false
      - ./var/game:/app/var/game:ro
      - ./var/locales:/app/var/locales:ro
      - ./var/geoip:/app/var/geoip:ro
      - ./var/maps:/app/var/maps:ro
      - ./resources/Maps:/app/resources/Maps:ro
      - ./var/runtime:/app/var/runtime:ro
      - ./var/reports:/app/var/reports:ro
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
  https:
    image: caddy:2
    profiles: [https]
    ports:
      - "80:80"
      - "443:443"
    environment:
      WC3_DOMAIN: ${WC3_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped
volumes:
  issue_data:
  activity_data:
  caddy_data:
  caddy_config:
